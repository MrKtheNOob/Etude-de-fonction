<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://unpkg.com/htmx.org@1.8.6/dist/htmx.min.js"></script>
    
    <title>My App</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <style>
        /* #help-container,
        #showhelp {
            position: relative;
            right: 43%;
        } */

        .input-container {
        
            position: relative;
            bottom: 2em;
        }

        #help-container {
            visibility: hidden;
            transition: all 300ms ease;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 20em;
        }
       
        .clicked {
            box-sizing: border-box;
            visibility: visible;
            transition: all 300ms ease;
            border: 3px solid black;
            border-radius: 5px;
            width: 30em;
            font-size: 2em;
            position: absolute;
            top: 10%;
            left: 33%;
            z-index: 2;
            background-color: antiquewhite;
        }
        
       
    </style>
</head>

<body>
    <h1>Calculateur de limites</h1>
    <div id="help-container"  >
        <p id="help">
            fraction \(\frac{numérateur}{dénominateur}\): numérateur / dénominateur
            <br>
            multiplication (\(\times\)): *
            <br>
            addition (\(+\)): +
            <br>
            soustraction (\(-\)): - (tiret du milieu)
            <br>
            puissance (\(^x\)): **puissance
            <br>
            racine carré (\( \sqrt{x} \)): sqrt(expression)
            <br>
            infini (\(\infty\)) :oo
        </p>
    </div>
    <div class="input-container" >
        <form id="limit-form" hx-post="/calculate/limit" hx-trigger="submit" hx-target="#limit-form"
            hx-swap="innerHTML">
            <label for="fonction">
                <input type="text" style="padding: 0.4em;" id="finput" placeholder="f(x)" name="fonction" value="x^3"> 
            </label>
            <br><br><br>
            <label for="variable">
                <input type="hidden" placeholder="variable" name="variable" value="x">
            </label>
            <br><br><br>
            <label for="target">
                <input type="text" placeholder="valeur limite" name="target" value="4">
            </label>
            <br><br><br>
            <button id="calculatebtn" type="submit">Calculate</button>
        </form>

    </div>
    <div id="output"></div>
    <button id="showhelp">Aide</button>
    <script src="../static/js/script.js"></script>
</body>

</html>
