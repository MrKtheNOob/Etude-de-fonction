<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://unpkg.com/htmx.org@1.8.6/dist/htmx.min.js"></script>
    
    <title>My App</title>
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
    <h1>Calculateur de dérivée</h1>
    <button id="showhelp" style="font-size: 2em;">Aide</button>
    <div id="help-container"  >
        <p id="help">
            fraction \(\frac{numérateur}{dénominateur}\): numérateur / dénominateur
            <br>
            multiplication (\(\times\)): *
            <br>
            addition (\(+\)): +
            <br>
            soustraction (\(-\)): - (tiret du milieu)
            <br>
            puissance (\(^x\)): **puissance
            <br>
            racine carré (\( \sqrt{x} \)): sqrt(expression)
            <br>
            infini (\(\infty\)) :oo
        </p>
    </div>
    <div class="input-container" >
        <form id="input-form" hx-post="/calculate/derivative" hx-trigger="submit" hx-target="#input-form"
            hx-swap="innerHTML">
            <label for="fonction">
                <input type="text" style="padding: 0.4em;" id="finput" placeholder="f(x)" name="fonction" value="x^3"> 
            </label>
            <br>
            <button id='calculatebtn' type="submit">Calculate</button>
        </form>
    </div>
    
    
    <script src="../static/js/script.js"></script>
</body>

</html>
